<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css?family=Source+Code+Pro:400,900|Source+Sans+Pro:300,900&display=swap"
        rel="stylesheet">
    <!-- <link rel="stylesheet" href="style.css"> -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/todo-form.css">
    <link rel="stylesheet" href="css/todo-list.css">
    <link rel="stylesheet" href="css/calendar.css">
    <link rel="stylesheet" href="css/dialog.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/responsive.css">
    <title>Daily Todo List</title>
</head>

<body>
    <div class="todo-app">
        <!-- TITLE SECTION -->
        <div class="title-section">
            <h1 class="logo-title">daily &lt;todo&gt;</h1>
        </div>

        <!-- SUBTITLE SECTION -->
        <div class="subtitle-section">
            <h3 class="logo-subtitle">by Mayuree Reunsati</h3>
            <div class="social-icons">
                <a href="https://github.com/mareerray" target="_blank" rel="noopener noreferrer" title="GitHub">
                    <i class="bi bi-github"></i>
                </a>
                <a href="https://linkedin.com/in/mayuree-reunsati" target="_blank" rel="noopener noreferrer"
                    title="LinkedIn">
                    <i class="bi bi-linkedin"></i>
                </a>
            </div>
        </div>

        <!-- HEADER -->
        <header>
            <div class="selected-date-display" id="selectedDateDisplay"></div>
            <button class="date-nav-btn" id="prevDateBtn" aria-label="Previous date" title="Previous date"><i
                    class="bi bi-chevron-left"></i></button>
            <button id="calendarBtn" class="date-picker" aria-label="Open calendar" title="Open calendar"><i
                    class="bi bi-calendar3"></i></button>
            <button class="date-nav-btn" id="nextDateBtn" aria-label="Next date" title="Next date"><i
                    class="bi bi-chevron-right"></i></button>
        </header>

        <!-- INPUT SECTION -->
        <div class="input-container">
            <form>
                <div class="input-group">
                    <select class="priority-select" title="Priority" id="prioritySelect">
                        <option value="high">🔴 High</option>
                        <option value="medium" selected>🟡 Medium</option>
                        <option value="low">🔵 Low</option>
                    </select>
                    <datalist id="priorityDescriptions">
                        <option data-value="high">🔴 High - Do it now (Tasks that need immediate attention)</option>
                        <option data-value="medium">🟡 Medium - Finish soon (Tasks to complete today)</option>
                        <option data-value="low">🔵 Low - Plan for later (Tasks that can wait)</option>
                    </datalist>
                    <input type="text" class="todo-input" placeholder="Add a new task ..." maxlength="50">
                    <button class="todo-button" type="submit" aria-label="Add task" title="Add task">
                        <i class="bi bi-plus-circle-fill"></i>
                    </button>
                </div>
            </form>
            <div class="filter-sort-container">
                <div class="select">
                    <select name="todos" class="filter-todo" aria-label="Filter tasks" title="Filter tasks">
                        <option value="all">All</option>
                        <option value="completed">Completed</option>
                        <option value="uncompleted">Active</option>
                        <option value="high">🔴 High - Do it now</option>
                        <option value="medium">🟡 Medium - Finish soon</option>
                        <option value="low">🔵 Low - Plan for later</option>
                    </select>
                </div>
                <button class="sort-btn"><i class="bi bi-sort-down fs-4"></i> Priority</button>
            </div>
        </div>

        <!-- PRIORITY LEGEND -->
        <div class="priority-legend">
            <span class="legend-item"><span class="legend-dot high"></span> Do it now</span>
            <span class="legend-item"><span class="legend-dot medium"></span> Finish soon</span>
            <span class="legend-item"><span class="legend-dot low"></span> Plan later</span>
        </div>

        <!-- TASK DIALOG -->
        <div id="addDialog" class="dialog-overlay" hidden>
            <div class="dialog-box">
                <h3 class="dialog-title">Add a task</h3>

                <input type="date" id="addDialogDate" class="dialog-date-input date-picker" />

                <div class="input-group">
                    <label for="dialogPrioritySelect" class="dialog-label">Choose priority</label>
                    <select id="dialogPrioritySelect" class="priority-select" title="Priority">
                        <option value="high">🔴 High</option>
                        <option value="medium" selected>🟡 Medium</option>
                        <option value="low">🔵 Low</option>
                    </select>
                    <input type="text" id="dialogTodoInput" class="todo-input" placeholder="Add a new task..."
                        maxlength="50">
                    <button id="dialogAddButton" type="button" class="todo-button" aria-label="Add task"
                        title="Add task">
                        <i class="bi bi-plus-circle-fill"></i>
                    </button>
                </div>

                <button id="closeAddDialog" type="button" class="dialog-cancel">Cancel</button>
            </div>
        </div>
    </div>
    <!-- TODO LIST SECTION -->
    <div class="todo-container">
        <ul class="todo-list"></ul>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-view="home">
            <i class="bi bi-house-fill"></i>
            <span>Home</span>
        </button>
        <button class="nav-item" data-view="add">
            <i class="bi bi-plus-circle-fill"></i>
            <span>Add</span>
        </button>
        <button class="nav-item" data-view="search">
            <i class="bi bi-search"></i>
            <span>Search</span>
        </button>

        <div class="language-menu-wrapper nav-item" data-view="language">
            <button class="language-button" id="languageButton" aria-label="Change language" title="Change language">
                <i class="bi bi-globe"></i>
                <span>Language</span>
            </button>
            <div id="languageMenu" class="language-dropdown" aria-label="Languages" hidden>
                <button class="language-item" data-lang="de">Deutsch</button>
                <button class="language-item" data-lang="en">English</button>
                <button class="language-item" data-lang="es">Español</button>
                <button class="language-item" data-lang="fi">Suomi</button>
                <button class="language-item" data-lang="it">Italiano</button>
                <button class="language-item" data-lang="ja">日本語</button>
                <button class="language-item" data-lang="ko">한국어</button>
                <button class="language-item" data-lang="ru">Русский</button>
                <button class="language-item" data-lang="sv">Svenska</button>
                <button class="language-item" data-lang="th">ไทย</button>
                <button class="language-item" data-lang="uk">Українська</button>
            </div>
        </div>
    </nav>

    <!-- CALENDAR OVERLAY -->
    <div id="calendarOverlay" class="calendar-overlay">
        <div class="calendar-popup">
            <div class="calendar-header">
                <button id="prevMonthBtn" class="calendar-nav-btn" aria-label="Previous month" title="Previous month"><i
                        class="bi bi-chevron-left"></i></button>
                <div id="calendarMonthYear" class="calendar-month-year"></div>
                <button id="nextMonthBtn" class="calendar-nav-btn" aria-label="Next month" title="Next month"><i
                        class="bi bi-chevron-right"></i></button>
            </div>
            <div class="calendar-weekdays">
                <div class="calendar-weekday">Su</div>
                <div class="calendar-weekday">Mo</div>
                <div class="calendar-weekday">Tu</div>
                <div class="calendar-weekday">We</div>
                <div class="calendar-weekday">Th</div>
                <div class="calendar-weekday">Fr</div>
                <div class="calendar-weekday">Sa</div>
            </div>
            <div id="calendarDays" class="calendar-days"></div>
            <div class="calendar-footer">
                <button id="calendarTodayBtn" class="calendar-today-btn">Today</button>
                <button id="calendarCloseBtn" class="calendar-close-btn">Close</button>
            </div>
        </div>
    </div>

    <!-- Load modules in order -->
    <script src="js/i18n.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/todos.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>

    <script>
        // Add descriptions to priority select options
        const priorityDescriptions = {
            high: "🔴 High - Do it now (Tasks that need immediate attention)",
            medium: "🟡 Medium - Finish soon (Tasks to complete today)",
            low: "🔵 Low - Plan for later (Tasks that can wait)"
        };

        const prioritySelectEl = document.getElementById('prioritySelect');

        // Add title attributes to options for tooltip display
        prioritySelectEl.querySelectorAll('option').forEach(option => {
            option.title = priorityDescriptions[option.value];
        });
    </script>
</body>

</html>
